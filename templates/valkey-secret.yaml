{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rybbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
data:
  {{- if .Values.valkey.auth.password }}
  valkey-password: {{ .Values.valkey.auth.password | b64enc | quote }}
  {{- else }}
  valkey-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
