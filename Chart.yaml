apiVersion: v2
name: rybbit
description: A Helm chart for Rybbit self-hosted analytics
type: application
version: 0.8.0-rc1
appVersion: "2.4.0"
kubeVersion: ">=1.19.0-0"
maintainers:
- name: Antônio Lago
  email: antonio.clago@outlook.com
  url: https://github.com/antoniolago
keywords:
- analytics
- self-hosted
- rybbit
home: https://github.com/antoniolago/rybbit-helm
sources:
- https://github.com/antoniolago/rybbit-helm

dependencies:
- name: cluster
  alias: postgresql
  version: "0.6.0"
  repository: https://cloudnative-pg.github.io/charts
  condition: postgresql.enabled
  tags:
  - postgresql
- name: clickhouse
  version: "0.3.9"
  repository: https://helm.altinity.com/
  condition: clickhouse.enabled
  tags:
  - clickhouse
- name: valkey
  version: "0.11.0"
  repository: https://valkey-io.github.io/valkey-helm/
  condition: valkey.enabled
  tags:
  - valkey
